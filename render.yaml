projects:
  - name: CyberVault
    environments:
      - name: Production
        services:
          - type: web
            name: cybervault
            runtime: docker
            dockerfilePath: ./Dockerfile.cybervault
            region: oregon
            plan: free
            healthCheckPath: /api/healthz
            envVars:
              - key: JWT_SECRET
                generateValue: true
              - key: DATABASE_URL
                fromDatabase:
                  name: cybervault-db
                  property: connectionString
        databases:
          - name: cybervault-db
            region: oregon
            plan: free
            ipAllowList: []
