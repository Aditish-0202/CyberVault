kind = "web"
previewPath = "/"
title = "Cybersecurity Dashboard"
version = "1.0.0"
id = "artifacts/cyber-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22826

[services.development]
run = "pnpm --filter @workspace/cyber-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cyber-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/cyber-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22826"
BASE_PATH = "/"
